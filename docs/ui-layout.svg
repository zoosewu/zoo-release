<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1560" viewBox="0 0 1280 1560" font-family="'Microsoft JhengHei','Noto Sans TC','PingFang TC',sans-serif" font-size="14">
  <style>
    .bg { fill: #ffffff; }
    .h { font-size: 20px; font-weight: 700; fill: #111827; }
    .win { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .bar { fill: #e5e7eb; }
    .ph { fill: #e5e7eb; }
    .ph2 { fill: #f3f4f6; }
    .t { fill: #111827; }
    .mut { fill: #6b7280; }
    .link { fill: #2563eb; }
    .banner { fill: #eef4ff; stroke: #3b6fd8; stroke-width: 1.2; }
    .bad { fill: #fdecec; stroke: #d14343; stroke-width: 1.2; }
    .btn { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; }
    .pri { fill: #2563eb; }
    .prit { fill: #ffffff; font-weight: 700; }
    .num { fill: #f59e0b; }
    .numt { fill: #ffffff; font-size: 12px; font-weight: 700; }
    .note { fill: #374151; font-size: 14px; }
    .noteb { fill: #111827; font-size: 14px; font-weight: 700; }
    .sel { fill: #dbeafe; }
    .line { stroke: #d1d5db; stroke-width: 1; }
  </style>
  <rect class="bg" width="1280" height="1560"/>

  <!-- ============ 1. 主畫面 ============ -->
  <text class="h" x="40" y="44">1. 主畫面：新版本橫幅（浮動）</text>
  <rect class="win" x="40" y="64" width="760" height="330" rx="8"/>
  <rect class="bar" x="40.75" y="64.75" width="758.5" height="32" rx="7"/>
  <text class="t" x="56" y="86">&lt;App 名稱&gt;</text>
  <text class="mut" x="740" y="86">—  ☐  ✕</text>
  <!-- toolbar -->
  <rect class="ph" x="56" y="108" width="70" height="24" rx="4"/>
  <rect class="ph" x="134" y="108" width="70" height="24" rx="4"/>
  <rect class="ph" x="212" y="108" width="70" height="24" rx="4"/>
  <text class="mut" x="300" y="125" font-size="12">工具列</text>
  <!-- content：從工具列下方開始，橫幅不佔版面 -->
  <rect class="ph2" x="56" y="142" width="728" height="236" rx="6"/>
  <text class="mut" x="420" y="240" text-anchor="middle">主內容（版面不因橫幅移動）</text>
  <!-- banner：浮在主內容右下角，離邊緣 16px -->
  <g transform="translate(-16,-16)">
  <rect x="227" y="321" width="560" height="48" rx="6" fill="#000" opacity="0.12"/>
  <rect class="banner" x="224" y="318" width="560" height="48" rx="6"/>
  <text class="t" x="240" y="347" font-weight="700">有新版本 v0.7.0</text>
  <rect class="btn" x="480" y="328" width="84" height="28" rx="5"/><text class="t" x="522" y="347" text-anchor="middle">版本說明</text>
  <rect class="btn" x="572" y="328" width="100" height="28" rx="5"/><text class="t" x="622" y="347" text-anchor="middle">略過此版本</text>
  <rect class="pri" x="680" y="328" width="64" height="28" rx="5"/><text class="prit" x="712" y="347" text-anchor="middle">更新</text>
  <text class="mut" x="757" y="348" font-size="16">✕</text>
  <!-- markers -->
  <circle class="num" cx="228" cy="318" r="10"/><text class="numt" x="228" y="322" text-anchor="middle">1</text>
  <circle class="num" cx="522" cy="322" r="10"/><text class="numt" x="522" y="326" text-anchor="middle">2</text>
  <circle class="num" cx="622" cy="322" r="10"/><text class="numt" x="622" y="326" text-anchor="middle">3</text>
  <circle class="num" cx="712" cy="322" r="10"/><text class="numt" x="712" y="326" text-anchor="middle">4</text>
  <circle class="num" cx="764" cy="322" r="10"/><text class="numt" x="764" y="326" text-anchor="middle">5</text>
  </g>
  <!-- notes -->
  <g transform="translate(830,120)">
    <circle class="num" cx="10" cy="-5" r="10"/><text class="numt" x="10" y="-1" text-anchor="middle">1</text>
    <text class="noteb" x="28" y="0">位置</text>
    <text class="note" x="28" y="20">浮在主內容右下角（離邊緣約 16px），疊在內容上，</text>
    <text class="note" x="28" y="40">不推擠版面、不搶焦點。不是對話框。</text>
    <circle class="num" cx="10" cy="65" r="10"/><text class="numt" x="10" y="69" text-anchor="middle">2</text>
    <text class="noteb" x="28" y="70">版本說明</text><text class="note" x="100" y="70">開啟 Release 頁面（瀏覽器）</text>
    <circle class="num" cx="10" cy="100" r="10"/><text class="numt" x="10" y="104" text-anchor="middle">3</text>
    <text class="noteb" x="28" y="105">略過此版本</text><text class="note" x="114" y="105">記下 主.次，橫幅消失</text>
    <circle class="num" cx="10" cy="135" r="10"/><text class="numt" x="10" y="139" text-anchor="middle">4</text>
    <text class="noteb" x="28" y="140">更新</text><text class="note" x="66" y="140">唯一的主要按鈕，按了才下載</text>
    <circle class="num" cx="10" cy="170" r="10"/><text class="numt" x="10" y="174" text-anchor="middle">5</text>
    <text class="noteb" x="28" y="175">✕ 稍後</text><text class="note" x="90" y="175">這次執行期間不再顯示</text>
    <text class="note" x="0" y="215">只在主版或次版較新、且沒有略過時出現。</text>
    <text class="note" x="0" y="237">修補版不出現橫幅，只在「關於」頁顯示。</text>
  </g>

  <!-- ============ 2. 橫幅狀態 ============ -->
  <text class="h" x="40" y="450">2. 橫幅的狀態</text>
  <!-- available -->
  <rect class="banner" x="40" y="470" width="760" height="44" rx="6"/>
  <text class="t" x="56" y="497" font-weight="700">有新版本 v0.7.0</text>
  <rect class="btn" x="448" y="478" width="84" height="28" rx="5"/><text class="t" x="490" y="497" text-anchor="middle">版本說明</text>
  <rect class="btn" x="540" y="478" width="100" height="28" rx="5"/><text class="t" x="590" y="497" text-anchor="middle">略過此版本</text>
  <rect class="pri" x="648" y="478" width="72" height="28" rx="5"/><text class="prit" x="684" y="497" text-anchor="middle">更新</text>
  <text class="mut" x="762" y="498" font-size="16">✕</text>
  <text class="noteb" x="830" y="497">有新版本</text>
  <!-- downloading -->
  <rect class="banner" x="40" y="526" width="760" height="44" rx="6"/>
  <text class="t" x="56" y="553" font-weight="700">正在下載 v0.7.0</text>
  <rect x="200" y="542" width="380" height="12" rx="6" fill="#dbe4f5"/>
  <rect x="200" y="542" width="258" height="12" rx="6" fill="#2563eb"/>
  <text class="t" x="592" y="553">68%</text>
  <rect class="btn" x="712" y="534" width="72" height="28" rx="5"/><text class="t" x="748" y="553" text-anchor="middle">取消</text>
  <text class="noteb" x="830" y="553">下載中</text><text class="note" x="900" y="553">驗證簽章後才算完成</text>
  <!-- ready -->
  <rect class="banner" x="40" y="582" width="760" height="44" rx="6"/>
  <text class="t" x="56" y="609" font-weight="700">v0.7.0 已下載，重新啟動後完成更新</text>
  <rect class="pri" x="664" y="590" width="120" height="28" rx="5"/><text class="prit" x="724" y="609" text-anchor="middle">立即重新啟動</text>
  <text class="noteb" x="830" y="609">已下載</text><text class="note" x="900" y="609">不自動重啟</text>
  <!-- failed -->
  <rect class="bad" x="40" y="638" width="760" height="44" rx="6"/>
  <text class="t" x="56" y="665" font-weight="700">更新失敗：簽章驗證失敗</text>
  <rect class="btn" x="648" y="646" width="92" height="28" rx="5"/><text class="t" x="694" y="665" text-anchor="middle">手動下載</text>
  <text class="mut" x="762" y="666" font-size="16">✕</text>
  <text class="noteb" x="830" y="665">失敗</text><text class="note" x="900" y="665">原因用用詞表的 update.reason.*</text>

  <!-- ============ 3. 關於頁 ============ -->
  <text class="h" x="40" y="740">3. 「關於」頁（設定的最後一頁）</text>
  <rect class="win" x="40" y="760" width="760" height="540" rx="8"/>
  <rect class="bar" x="40.75" y="760.75" width="758.5" height="32" rx="7"/>
  <text class="t" x="56" y="782">設定</text>
  <!-- sidebar -->
  <rect class="ph2" x="41" y="793" width="170" height="506"/>
  <text class="t" x="60" y="826">一般</text>
  <text class="t" x="60" y="858">外觀</text>
  <text class="t" x="60" y="890">…</text>
  <rect class="sel" x="48" y="904" width="156" height="30" rx="5"/>
  <text class="t" x="60" y="924" font-weight="700">關於</text>
  <!-- content -->
  <text class="t" x="236" y="830" font-size="18" font-weight="700">關於</text>
  <text class="t" x="236" y="872" font-size="18" font-weight="700">&lt;App 名稱&gt;</text>
  <text class="mut" x="364" y="872">v0.6.4</text>
  <rect class="btn" x="680" y="852" width="100" height="30" rx="5"/><text class="t" x="730" y="872" text-anchor="middle">檢查更新</text>
  <text class="mut" x="236" y="898">&lt;一句話介紹&gt;</text>
  <text class="t" x="236" y="940">已是最新版</text><text class="mut" x="320" y="940">（上次檢查：今天 14:31）</text>
  <rect x="236" y="958" width="16" height="16" rx="3" fill="#2563eb"/><text x="239" y="971" fill="#fff" font-size="12">✓</text>
  <text class="t" x="260" y="971">自動檢查更新</text>
  <text class="link" x="236" y="1012">版本說明</text><text class="mut" x="300" y="1012">·</text>
  <text class="link" x="314" y="1012">原始碼</text><text class="mut" x="364" y="1012">·</text>
  <text class="link" x="378" y="1012">回報問題</text><text class="mut" x="442" y="1012">·</text>
  <text class="link" x="456" y="1012">授權 AGPL-3.0</text>
  <line class="line" x1="236" y1="1036" x2="780" y2="1036"/>
  <text class="t" x="236" y="1068" font-weight="700">作者的其他專案</text>
  <!-- cards -->
  <g>
    <rect class="ph" x="236" y="1084" width="80" height="50" rx="4"/><text class="mut" x="276" y="1113" text-anchor="middle" font-size="12">截圖</text>
    <text class="t" x="326" y="1102" font-weight="700">zing-explore</text>
    <text class="mut" x="326" y="1124">一句話介紹</text>
    <rect class="ph" x="512" y="1084" width="80" height="50" rx="4"/><text class="mut" x="552" y="1113" text-anchor="middle" font-size="12">截圖</text>
    <text class="t" x="602" y="1102" font-weight="700">Zoo Downloader</text>
    <text class="mut" x="602" y="1124">一句話介紹</text>
    <rect class="ph" x="236" y="1150" width="80" height="50" rx="4"/><text class="mut" x="276" y="1179" text-anchor="middle" font-size="12">截圖</text>
    <text class="t" x="326" y="1168" font-weight="700">waypoint</text>
    <text class="mut" x="326" y="1190">一句話介紹</text>
    <rect class="ph" x="512" y="1150" width="80" height="50" rx="4"/><text class="mut" x="552" y="1179" text-anchor="middle" font-size="12">截圖</text>
    <text class="t" x="602" y="1168" font-weight="700">z-overlay</text>
    <text class="mut" x="602" y="1190">一句話介紹</text>
    <text class="mut" x="236" y="1232">…（照 API 的順序，不列出自己；點卡片開啟 repo）</text>
  </g>
  <!-- markers -->
  <circle class="num" cx="220" cy="866" r="10"/><text class="numt" x="220" y="870" text-anchor="middle">A</text>
  <circle class="num" cx="220" cy="935" r="10"/><text class="numt" x="220" y="939" text-anchor="middle">B</text>
  <circle class="num" cx="220" cy="1007" r="10"/><text class="numt" x="220" y="1011" text-anchor="middle">C</text>
  <circle class="num" cx="220" cy="1063" r="10"/><text class="numt" x="220" y="1067" text-anchor="middle">D</text>
  <!-- notes -->
  <g transform="translate(830,866)">
    <circle class="num" cx="10" cy="-5" r="10"/><text class="numt" x="10" y="-1" text-anchor="middle">A</text>
    <text class="noteb" x="28" y="0">名稱、版本、檢查更新</text>
    <circle class="num" cx="10" cy="64" r="10"/><text class="numt" x="10" y="68" text-anchor="middle">B</text>
    <text class="noteb" x="28" y="69">狀態列</text>
    <text class="note" x="28" y="93">檢查中…（按鈕停用）</text>
    <text class="note" x="28" y="115">已是最新版（上次檢查：今天 14:31）</text>
    <text class="note" x="28" y="137">有新版本 v0.6.5 ［版本說明］［更新］</text>
    <text class="note" x="44" y="157" font-size="12" fill="#6b7280">修補版也在這裡顯示</text>
    <text class="note" x="28" y="179">下載中：與橫幅相同的進度</text>
    <text class="note" x="28" y="201">無法檢查更新 ［重試］</text>
    <circle class="num" cx="10" cy="236" r="10"/><text class="numt" x="10" y="240" text-anchor="middle">C</text>
    <text class="noteb" x="28" y="241">連結列</text>
    <text class="note" x="28" y="263">/releases · repo · /issues · LICENSE</text>
    <circle class="num" cx="10" cy="292" r="10"/><text class="numt" x="10" y="296" text-anchor="middle">D</text>
    <text class="noteb" x="28" y="297">作者的其他專案</text>
    <text class="note" x="28" y="319">資料來自 apex-code API（docs/API.md）</text>
    <text class="note" x="28" y="341">讀取失敗時整個區塊不顯示</text>
  </g>

  <!-- ============ 4. 托盤 ============ -->
  <text class="h" x="40" y="1360">4. 沒有空間的介面（托盤程式、輸入法）</text>
  <rect x="40" y="1490" width="760" height="40" fill="#1f2937" rx="4"/>
  <text x="580" y="1515" fill="#d1d5db" font-size="13">^</text>
  <rect x="604" y="1500" width="20" height="20" rx="4" fill="#9ca3af"/>
  <circle cx="622" cy="1502" r="5" fill="#2563eb" stroke="#1f2937" stroke-width="1.5"/>
  <text x="700" y="1515" fill="#d1d5db" font-size="13">14:31</text>
  <!-- menu -->
  <rect class="win" x="520" y="1376" width="220" height="104" rx="6"/>
  <rect class="sel" x="526" y="1382" width="208" height="30" rx="4"/>
  <text class="t" x="540" y="1402" font-weight="700">有新版本 v0.7.0</text>
  <line class="line" x1="526" y1="1420" x2="734" y2="1420"/>
  <text class="t" x="540" y="1444">設定</text>
  <text class="t" x="540" y="1468">結束</text>
  <g transform="translate(830,1400)">
    <text class="note" x="0" y="0">托盤圖示加上提示點，選單第一項顯示「有新版本 v0.7.0」，</text>
    <text class="note" x="0" y="22">點了開啟「關於」頁。不跳通知、不跳對話框。</text>
  </g>
</svg>
