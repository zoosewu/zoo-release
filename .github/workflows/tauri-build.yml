# 共用的 Tauri 建置（docs/RELEASE.md）：各平台建置並簽章更新檔，上傳成 release-<target> artifact，
# 之後由 release.yml 發布。tauri.conf.json 需要 bundle.createUpdaterArtifacts: true。
#   build:
#     uses: zoosewu/zoo-release/.github/workflows/tauri-build.yml@v1
#     secrets: inherit
name: tauri-build

on:
  workflow_call:
    inputs:
      targets:
        description: '建置平台，JSON 陣列：[{"os": "windows-latest", "target": "x86_64-pc-windows-msvc"}, ...]'
        type: string
        default: >-
          [{"os": "windows-latest", "target": "x86_64-pc-windows-msvc"},
           {"os": "macos-latest", "target": "aarch64-apple-darwin"},
           {"os": "macos-15-intel", "target": "x86_64-apple-darwin"},
           {"os": "ubuntu-22.04", "target": "x86_64-unknown-linux-gnu"}]
      project-path:
        description: 前端專案的資料夾（package.json 所在處），相對 repo 根目錄
        type: string
        default: .
      package-manager:
        description: pnpm 或 npm
        type: string
        default: pnpm
      node-version:
        type: string
        default: '24'
      args:
        description: 額外的 tauri build 參數（--target 會自動加上）
        type: string
        default: ''
      before-build:
        description: 建置前在 project-path 執行的 bash 指令，環境變數 VERSION 為 tag 的版本（不含 v），例如把版本寫進設定檔
        type: string
        default: ''
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.targets) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: 版本
        run: |
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then echo "::error::只能由推 tag 觸發"; exit 1; fi
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Linux 套件
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev patchelf

      - if: inputs.package-manager == 'pnpm'
        uses: pnpm/action-setup@v6
        with:
          package_json_file: ${{ inputs.project-path }}/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}
          cache-dependency-path: ${{ inputs.project-path }}/${{ inputs.package-manager == 'pnpm' && 'pnpm-lock.yaml' || 'package-lock.json' }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ inputs.project-path }}/src-tauri
          key: ${{ matrix.target }}

      - name: 安裝相依套件
        working-directory: ${{ inputs.project-path }}
        run: |
          if [[ "${{ inputs.package-manager }}" == "pnpm" ]]; then pnpm install --frozen-lockfile; else npm ci; fi

      - name: 建置前
        if: inputs.before-build != ''
        working-directory: ${{ inputs.project-path }}
        env:
          BEFORE_BUILD: ${{ inputs.before-build }}
        run: eval "$BEFORE_BUILD"

      - name: 建置
        id: tauri
        uses: tauri-apps/tauri-action@v1
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: ${{ inputs.project-path }}
          tauriScript: ${{ inputs.package-manager }} tauri
          args: --target ${{ matrix.target }} ${{ inputs.args }}

      - name: 收集檔案
        env:
          PATHS: ${{ steps.tauri.outputs.artifactPaths }}
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          # artifactPaths 含 .app 這類資料夾，只收檔案（.app 已打包成 .app.tar.gz）
          python3 - <<'EOF'
          import json, os, shutil
          out = os.path.join(os.environ["RUNNER_TEMP"], "out")
          for p in json.loads(os.environ["PATHS"]):
              if os.path.isfile(p):
                  shutil.copy2(p, out)
                  print(os.path.basename(p))
          EOF
          if [[ -z "$(ls -A "$RUNNER_TEMP/out")" ]]; then echo "::error::沒有建置出檔案"; exit 1; fi
          if ! ls "$RUNNER_TEMP/out"/*.sig >/dev/null 2>&1; then
            echo "::error::沒有更新檔的簽章：確認 tauri.conf.json 的 bundle.createUpdaterArtifacts 為 true，且已傳入簽章 secrets"; exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: ${{ runner.temp }}/out/*
          if-no-files-found: error
