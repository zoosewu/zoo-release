# 共用的 Docker 映像建置（docs/RELEASE.md）：推到 ghcr.io/<owner>/<image>，之後由 release.yml 建 Release。
#   images:
#     uses: zoosewu/zoo-release/.github/workflows/docker-image.yml@v1
#     with:
#       images: '[{"image": "zkaraver"}]'
# 每個映像的設定：
#   image      映像名稱（必填）
#   file       Dockerfile 路徑，預設 Dockerfile
#   context    建置的資料夾，預設 .
#   target     多階段建置的 target，預設不指定
#   platforms  預設 linux/amd64,linux/arm64
#   tags       docker/metadata-action 的 tags，預設 主.次.修補、主.次、latest（換行分隔）
# 建置時傳入 build-arg VERSION（tag 的版本，不含 v），供程式檢查新版本使用。
name: docker-image

on:
  workflow_call:
    inputs:
      images:
        description: 映像清單（JSON 陣列），見檔案開頭的說明
        type: string
        required: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.images) }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: 版本
        run: |
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then echo "::error::只能由推 tag 觸發"; exit 1; fi
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: 映像標籤
        id: tags
        env:
          CUSTOM: ${{ matrix.tags }}
        run: |
          {
            echo 'value<<ZOO_RELEASE_EOF'
            if [[ -n "$CUSTOM" ]]; then
              printf '%s\n' "$CUSTOM"
            else
              echo 'type=semver,pattern={{version}}'
              echo 'type=semver,pattern={{major}}.{{minor}}'
            fi
            echo 'ZOO_RELEASE_EOF'
          } >> "$GITHUB_OUTPUT"
          # 自訂 tags 時 latest 由自訂內容決定
          if [[ -n "$CUSTOM" ]]; then echo "latest=false" >> "$GITHUB_OUTPUT"; else echo "latest=auto" >> "$GITHUB_OUTPUT"; fi

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: ${{ steps.tags.outputs.value }}
          flavor: latest=${{ steps.tags.outputs.latest }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context || '.' }}
          file: ${{ matrix.file || 'Dockerfile' }}
          target: ${{ matrix.target || '' }}
          platforms: ${{ matrix.platforms || 'linux/amd64,linux/arm64' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ env.VERSION }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.target || 'default' }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.target || 'default' }}
