# 共用的發布（docs/RELEASE.md）：專案的 build job 把檔案上傳成 release-* artifact 後呼叫。
#   uses: zoosewu/zoo-release/.github/workflows/release.yml@v1
# 檢查 tag → 收集檔案 → 簽章 → sha256 → Release 說明（git-cliff）→ latest.json → 草稿 Release → 發布
name: release

on:
  workflow_call:
    inputs:
      name:
        description: Release 標題的前綴（標題為「<name> <版本>」）；省略時標題為 tag
        type: string
        default: ''
      platforms:
        description: 'latest.json 的更新檔對照，JSON：{"windows-x86_64": "<檔名或萬用字元>"}；省略＝沒有可自動更新的檔案'
        type: string
        default: '{}'
      notes-footer:
        description: 接在 Release 說明後面的固定文字檔（不存在就略過）
        type: string
        default: .github/release-notes.md
      notes-language:
        description: Release 說明的語言（zh-TW 或 en），專案沒有自己的 cliff.toml 時決定用哪一份預設設定
        type: string
        default: zh-TW
      publish:
        description: false 時只建草稿不發布（測試用）
        type: boolean
        default: true
      zoo-release-ref:
        description: 讀取 zoo-release 腳本與預設 cliff.toml 的版本
        type: string
        default: v1
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false

permissions:
  contents: write

concurrency:
  group: zoo-release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
      PLATFORMS: ${{ inputs.platforms }}
      NAME: ${{ inputs.name }}
      FOOTER: ${{ inputs.notes-footer }}
      NOTES_LANGUAGE: ${{ inputs.notes-language }}
    steps:
      - name: 檢查 tag
        run: |
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            echo "::error::只能由推 tag 觸發（目前是 $GITHUB_REF_TYPE $TAG）"; exit 1
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag $TAG 的格式需為 v主.次.修補（例如 v0.7.0、v0.7.0-rc.1）"; exit 1
          fi
          if [[ "$TAG" == *-* ]]; then echo "PRERELEASE=true" >> "$GITHUB_ENV"; else echo "PRERELEASE=false" >> "$GITHUB_ENV"; fi
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 取得 zoo-release
        uses: actions/checkout@v7
        with:
          repository: zoosewu/zoo-release
          ref: ${{ inputs.zoo-release-ref }}
          path: .zoo-release

      - name: 收集檔案
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: 確認檔案
        run: |
          mkdir -p dist   # Docker 專案沒有 artifact
          if [[ -n "$(find dist -mindepth 1 -type d)" ]]; then
            echo "::error::release-* artifact 裡不能有子資料夾，請上傳平面的檔案清單"; find dist; exit 1
          fi
          ls -la dist

      - name: 簽章
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # 先存成變數：platforms 對不到檔案時在這裡就失敗
          list=$(python3 .zoo-release/scripts/manifest.py --repo "$GITHUB_REPOSITORY" --tag "$TAG" \
            --dist dist --platforms "$PLATFORMS" --print-assets)
          assets=()
          if [[ -n "$list" ]]; then mapfile -t assets <<< "$list"; fi
          unsigned=()
          for f in "${assets[@]}"; do [[ -f "$f.sig" ]] || unsigned+=("$f"); done
          if (( ${#unsigned[@]} == 0 )); then echo "沒有需要簽章的檔案"; exit 0; fi
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            echo "::error::缺少 secret TAURI_SIGNING_PRIVATE_KEY：呼叫端要加上 secrets: inherit，並用 zoo-release 的 scripts/setup-secrets.ps1 設定（docs/SIGNING.md）"
            exit 1
          fi
          for f in "${unsigned[@]}"; do
            echo "簽章 $f"
            npx --yes @tauri-apps/cli@2 signer sign "$f"
            test -s "$f.sig"
          done

      - name: sha256
        working-directory: dist
        run: |
          shopt -s nullglob
          for f in *; do
            case "$f" in *.sig|*.sha256|latest.json) continue ;; esac
            sha256sum "$f" > "$f.sha256"
          done

      - name: Release 說明設定
        id: cliff
        run: |
          if [[ -f cliff.toml ]]; then config=cliff.toml
          elif [[ "$NOTES_LANGUAGE" == "en" ]]; then config=.zoo-release/cliff.en.toml
          else config=.zoo-release/cliff.toml; fi
          echo "config=$config" >> "$GITHUB_OUTPUT"
          # 正式版：上一個正式版到這個 tag；預先發行版：上一個正式版之後的全部變更
          if [[ "$PRERELEASE" == "true" ]]; then
            echo "args=--unreleased --tag $TAG --strip all" >> "$GITHUB_OUTPUT"
          else
            echo "args=--current --strip all" >> "$GITHUB_OUTPUT"
          fi

      - name: Release 說明（git-cliff）
        uses: orhun/git-cliff-action@v4
        with:
          config: ${{ steps.cliff.outputs.config }}
          args: ${{ steps.cliff.outputs.args }}
        env:
          OUTPUT: ${{ runner.temp }}/changes.md
          GITHUB_REPO: ${{ github.repository }}

      - name: 組合說明
        run: |
          changes="$RUNNER_TEMP/changes.md"
          touch "$changes"
          if [[ -z "$(tr -d '[:space:]' < "$changes")" ]]; then
            if git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' --exclude '*-*' "$TAG^" >/dev/null 2>&1; then
              if [[ "$NOTES_LANGUAGE" == "en" ]]; then echo "No listed changes in this version." > "$changes"; else echo "這個版本沒有列出的變更。" > "$changes"; fi
            else
              if [[ "$NOTES_LANGUAGE" == "en" ]]; then echo "First public release." > "$changes"; else echo "第一個公開版本。" > "$changes"; fi
            fi
          fi
          notes="$RUNNER_TEMP/notes.md"
          cp "$changes" "$notes"
          if [[ -f "$FOOTER" ]]; then printf '\n---\n\n' >> "$notes"; cat "$FOOTER" >> "$notes"; fi
          cat "$notes"

      - name: latest.json
        run: |
          python3 .zoo-release/scripts/manifest.py --repo "$GITHUB_REPOSITORY" --tag "$TAG" --dist dist \
            --platforms "$PLATFORMS" --notes-file "$RUNNER_TEMP/changes.md" --out dist/latest.json

      - name: 草稿 Release
        run: |
          title="$TAG"
          if [[ -n "$NAME" ]]; then title="$NAME $VERSION"; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在（重新執行）：更新說明並覆蓋檔案"
            gh release edit "$TAG" --title "$title" --notes-file "$RUNNER_TEMP/notes.md"
          else
            flags=()
            if [[ "$PRERELEASE" == "true" ]]; then flags+=(--prerelease); fi
            gh release create "$TAG" --verify-tag --draft --title "$title" --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}"
          fi
          gh release upload "$TAG" dist/* --clobber

      - name: 發布
        if: inputs.publish
        run: |
          if [[ "$PRERELEASE" == "true" ]]; then
            gh release edit "$TAG" --draft=false --prerelease
          else
            gh release edit "$TAG" --draft=false --latest
          fi
          echo "已發布：https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
