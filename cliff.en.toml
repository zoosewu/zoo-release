# zoo-release 預設的 Release 說明格式（git-cliff，英文）。release.yml 的 notes-language: en 使用。
# 繁體中文版見 cliff.toml。專案根目錄有自己的 cliff.toml 時優先使用專案的。
# 只列出上一個標籤到這個標籤之間、符合慣例式提交的 commit（`類型(範圍): 說明`），依類型分組；不符合格式的不列出。
# 本機預覽：git-cliff --config cliff.toml --unreleased --tag v0.2.0

[changelog]
header = ""
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.breaking %}**Breaking:** {% endif %}{{ commit.message | upper_first | trim }}{% if commit.scope %} ({{ commit.scope }}){% endif %}\
{% endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
# 只有正式版是分界：預先發行版（v0.7.0-rc.1）列出上一個正式版之後的全部變更
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
sort_commits = "oldest"
# 分組的順序以 HTML 註解的數字決定（顯示時去掉）
commit_parsers = [
  { message = "^chore\\(release\\)", skip = true },
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactoring" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  { message = "^(test|build|ci|chore|style)", group = "<!-- 5 -->Other" },
]
